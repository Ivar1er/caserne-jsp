{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-warning">
            <div class="card-body">
                <h3 class="text-center mb-4 text-warning">Sécurité - Première Connexion</h3>
                <p class="text-muted small">Pour des raisons de sécurité, veuillez modifier votre mot de passe provisoire et renseigner votre adresse e-mail pour la récupération future.</p>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nouvelle adresse e-mail</label>
                        <input type="email" name="email" class="form-control" value="{{ current_user.email or '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nouveau mot de passe (min. 6 caractères)</label>
                        <input type="password" name="new_password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold">Valider et continuer</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
