{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">
                <h3 class="text-center text-danger fw-bold mb-3">Modifier mon mot de passe</h3>
                <p class="text-muted text-center small mb-4">
                    Pour des raisons de sécurité lors de votre première connexion, vous devez définir votre propre mot de passe et renseigner votre e-mail.
                </p>

                <!-- Messages Flash -->
                

                <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if not current_user.first_login %}<div class="mb-3"><label class="form-label">Mot de passe actuel</label><input class="form-control" type="password" name="current_password" autocomplete="current-password" required></div>{% endif %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Votre e-mail (pour la récupération)</label>
                        <input type="email" name="email" class="form-control" value="{{ current_user.email or '' }}" placeholder="exemple@caserne.fr" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nouveau mot de passe</label>
                        <input type="password" name="new_password" class="form-control" placeholder="10 caractères minimum" minlength="10" maxlength="128" required>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 fw-bold py-2">Enregistrer le nouveau mot de passe</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
