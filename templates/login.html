{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-4">
        <div class="card shadow">
            <div class="card-body text-center">
                <div class="mb-3">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo JSP" width="100" height="100" class="rounded-circle shadow">
                </div>
                <h3 class="mb-4">Connexion</h3>
                <form method="POST" class="text-start">
                    <div class="mb-3">
                        <label class="form-label">Identifiant</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mot de passe</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-danger w-100">Se connecter</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('forgot_password') }}" class="text-decoration-none text-muted">Mot de passe oublié ?</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
