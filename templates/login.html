{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">
                <h3 class="text-center text-danger fw-bold mb-4">Connexion - Portail JSP</h3>

                <!-- Messages Flash pour afficher les erreurs -->
                

                <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Centre d'incendie et de secours</label>
                        <select name="section_id" class="form-select"><option value="">Administration globale</option>
                            {% for sec in sections %}
                                <option value="{{ sec.id }}">{{ sec.nom }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nom d'utilisateur</label>
                        <input type="text" name="username" class="form-control" placeholder="Identifiant" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Mot de passe</label>
                        <input type="password" name="password" class="form-control" placeholder="Mot de passe" required>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 fw-bold py-2">Se connecter</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('forgot_password') }}" class="text-decoration-none text-muted small">Mot de passe oublié ?</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
